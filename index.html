 modelin gördüğü fonksiyon adı, açıklaması ve parametreleri.","Sır yönetimi — anahtarların prompt'a değil, kasaya konması gerektiği ilkesi."],"techniques":["LLM08-003"],"do":"Bir yerel modele kendi yazdığın sistem promptunu ver, içine sahte bir 'iç API anahtarı' koy. Sonra sızdırmayı dene — savunmacı gözüyle de neyi yanlış yaptığını gör."},{"id":"M06-3","title":"Savunma tarafı: neyi engelleyebilirsin, neyi engelleyemezsin","body":"Dürüst ol: sistem promptu gizli kalmaz. Yeterince denemeyle çoğu sızar. O yüzden savunma 'sızmasın' değil, 'sızarsa da değersiz olsun' üzerine kurulur: prompt'ta sır tutma, araç yetkisini prompt metnine değil sunucu tarafı kontrole bağla, anahtarı modele hiç gösterme.\n\nBağlam sızıntısı için: kullanıcı başına veri izolasyonu, RAG sonuçlarında yetki filtresi (kullanıcının görmeye hakkı olmayan doküman bağlama hiç girmesin), çıktı tarafında PII taraması (Presidio gibi).","analogy":"Cüzdanını kaybetmemeye çalışmak yerine, kaybettiğinde işe yaramayacak hâle getirmek: nakit yerine iptal edilebilir kart taşımak.","attacker":"İyi savunulmuş bir sistemde sistem promptunu alman bir şey kazandırmaz. Bunu gördüğünde raporuna yaz — savunmanın doğru kurulduğu yeri belirtmek, red team raporunun kalitesini gösterir.","terms":["En az yetki (least privilege) — her bileşene sadece gerekeni verme.","PII — kişiyi tanımlayan veri; çıktıda maskelenmesi gerekir.","Veri izolasyonu — kullanıcıların verisinin birbirine karışmaması."],"do":"Cephanelik'ten Presidio ve Llama Guard kartlarını oku. Hangisinin hangi sızıntı tipine çare olduğunu yaz."}],"checkpoint":{"areas":["LLM02","LLM08"],"count":12,"pass":75},"order":6},{"id":"M07","title":"Ajanlar ve aşırı yetki — enjeksiyonun eyleme dönüştüğü yer","goal":"Neden LLM03'ün 2026 listesinde yukarı çıktığını ve gerçek zararın nerede oluştuğunu anlamak.","level":"ileri","areas":["LLM03","LLM04"],"sections":[{"id":"M07-1","title":"Kandırılan model değil, verilen yetki","body":"Bir model kandırıldığında en fazla kötü bir metin üretir. Zarar, o metnin bir EYLEME dönüşebilmesinden doğar: e-posta gönderildi, kayıt değişti, dosya silindi, ödeme başlatıldı, kod çalıştı.\n\nBu yüzden LLM03'ün doğru okunuşu şudur: 'model kandırılabilir' bir varsayımdır, tasarım sorusu ise 'kandırıldığında ne yapabilir?'. Morris II çalışmasında e-posta asistanları, gelen bir mesajdaki talimatı uygulayıp aynı metni başkalarına yollayarak solucan gibi yayıldı — çünkü gönderme yetkisi vardı ve onay yoktu.","analogy":"Bir stajyere yalan söylemek başlı başına zarar değildir. Stajyerin şirket hesabından para transferi yetkisi varsa, o yalan bir soyguna dönüşür. Yetki, zararın çarpanıdır.","attacker":"Angajmanda en yıkıcı aracı hedefle, en kolay aracı değil. 'Takvime etkinlik ekleyebiliyor' düşük etkidir; 'kurumsal e-posta gönderebiliyor' veya 'ERP kaydı açabiliyor' rapor başlığıdır.","terms":["Aşırı yetki (excessive agency) — modelin gereğinden fazla eylem hakkına sahip olması.","Ajan solucanı — kendi kendini yayan enjeksiyon (Morris II).","Geri dönülemez işlem — silme, gönderme, ödeme gibi geri alınamayan eylemler."],"techniques":["LLM03-001","LLM03-002"],"do":"PortSwigger'ın 'excessive agency' lab'ını bitir. Bitirince şunu yaz: hangi tek kontrol eklenseydi saldırı durdurulurdu?"},{"id":"M07-2","title":"Araç zinciri ve yetki yükseltme","body":"Ajanlar tek araç kullanmaz; zincir kurar. Arama → dosya okuma → özetleme → e-posta. Zincirin her halkası bir sonrakine girdi üretir ve o girdi de güvenilmezdir.\n\nSaldırı buradan çıkar: zararsız görünen bir araçla, tehlikeli bir aracın girdisini kontrol etmek. Örneğin dosya okuma aracıyla getirdiğin metin, e-posta aracının gövdesine giriyorsa, dosyaya yazdığın talimat gönderilen postayı belirler. Buna araç zinciriyle yetki yükseltme denir. MCP ekosisteminde bunun tedarik zinciri versiyonu da var: araç tanımının onay sonrası değiştirilmesi (rug pull, CVE-2025-54136).","analogy":"Bir kurumda imza yetkisi olmayan biri, imza yetkilisinin masasına koyduğu evrakı değiştirebiliyorsa, imzayı fiilen o kontrol eder.","attacker":"Zinciri çiz: hangi aracın çıktısı hangi aracın girdisi oluyor? En zayıf halkadan gir, en güçlü halkaya ulaş. Ajan sistemlerinde bulguların çoğu tek araçta değil, iki aracın arasındadır.","terms":["Tool chaining — araç çıktısının başka araca girdi olması.","MCP — modellerin dış araçlara bağlandığı protokol; araç tanımları bağlama girer.","Rug pull — onaylanmış bir bileşenin sonradan sessizce değiştirilmesi."],"techniques":["LLM04-001"],"do":"Senaryolar'dan 'Fatura özetleyen ajan' senaryosunu oku, çözümü açmadan önce zinciri kâğıda çiz."},{"id":"M07-3","title":"Hafıza zehirlenmesi: yarın da senin dediğini yapsın","body":"Modern asistanların kalıcı 'hafızası' var: tercihler, notlar, önceki kararlar. Bu hafıza da bağlama giriyor. Saldırgan bir kez enjeksiyon yapıp hafızaya kalıcı bir talimat yazdırabilirse, saldırı her oturumda yeniden tetiklenir.\n\nMINJA gibi çalışmalar bunun sadece sorgularla, modele hiç doğrudan erişmeden yapılabildiğini gösterdi. Savunma tarafında hafızaya yazma işlemi de bir 'yazma yetkisi'dir ve onay gerektirir — ama çoğu üründe sessizce yapılır.","analogy":"Bir kere söylenen yalan unutulur; ajandaya yazdırılan yalan her sabah okunur. Hafıza, saldırının kalıcılık (persistence) katmanıdır.","attacker":"Kalıcılık ara. 'Bunu not al', 'tercihlerime ekle', 'bundan sonra hep böyle yap' cümleleri senin için kalıcılık ilkelleridir. Bir sonraki oturumda hâlâ orada mı diye kontrol et.","terms":["Kalıcılık (persistence) — saldırının oturum sonrasında da etkili kalması.","Hafıza zehirlenmesi — kalıcı belleğe saldırgan talimatı yazdırma."],"techniques":["LLM05-001"],"do":"Hafızası olan bir asistanda (izinli, kendi hesabında) zararsız bir tercih yazdır, yeni oturumda hatırlıyor mu bak. Bunun saldırgan için ne demek olduğunu yaz."}],"checkpoint":{"areas":["LLM03","LLM04"],"count":12,"pass":75},"order":7},{"id":"M08","title":"Çıktı işleme — LLM'den klasik web zafiyetine köprü","goal":"Modelin çıktısının nereye aktığını takip etmeyi ve LLM10'u klasik zafiyetlerle birleştirmeyi öğrenmek.","level":"ileri","areas":["LLM10"],"sections":[{"id":"M08-1","title":"Model çıktısı = güvenilmez girdi","body":"Kural tek cümle: modelin ürettiği her şey, kullanıcıdan gelmiş gibi güvenilmezdir. Ama uygulamalar çıktıyı sık sık doğrudan kullanır: HTML olarak render eder, markdown'ı çözer, SQL'e koyar, shell komutu olarak çalıştırır, eval() eder, dosya adı yapar.\n\nSonuç tanıdık: XSS, SSRF, komut enjeksiyonu, path traversal, RCE. Yani LLM10, aslında bildiğin web zafiyetlerinin AI üzerinden tetiklenmesidir. Bu yüzden web pentest bilgisi burada doğrudan işe yarar.","analogy":"Tercümana güvenip söylediğini imzalamak gibi. Tercüman kötü niyetli olmasa bile yanlış çevirebilir; sen imzaladığında sorumluluk sende.","attacker":"Şu soruyu sor: çıktı NEREYE gidiyor? Ekranda mı, bir API'ye mi, bir terminale mi, bir veritabanına mı? Her varış noktası ayrı bir zafiyet sınıfıdır. En hızlı bulgu genelde render katmanındadır.","terms":["Insecure output handling — çıktının doğrulanmadan kullanılması.","XSS / SSRF / RCE — çıktının vardığı yere göre ortaya çıkan klasik zafiyetler."],"techniques":["LLM10-002"],"do":"PortSwigger 'Exploiting insecure output handling in LLMs' lab'ını çöz. Payload'ın modelden değil, render'dan çalıştığını gör."},{"id":"M08-2","title":"Kod üreten asistanlar: zararın en sessiz yolu","body":"Kod asistanları çıktısını doğrudan geliştiricinin projesine yazar. Üç risk iç içe: (1) model güvensiz kod üretir (SQL birleştirme, zayıf kripto); (2) var olmayan paket adı uydurur ve saldırgan o adı npm/PyPI'da açar (slopsquatting); (3) depodaki README veya yorum satırına gömülü talimat asistanı yönlendirir.\n\nÜçü de kod incelemesinden geçip üretime gider. 2026'daki ajan-skill zehirlenmesi vakaları (zararlı 'skill' paketleri) bunun olgunlaşmış hâlidir.","analogy":"Yemeği kim pişirdiğine bakmadan yemek gibi. Tabak güzel görünüyor diye içindekini sormuyorsan, zehirlenme mutfakta başlar.","attacker":"Bir kurumda kod asistanı varsa saldırı yüzeyi artık depodur: README, issue şablonu, commit mesajı, bağımlılık adı. Geliştiricinin editörü senin çalıştırma ortamındır.","terms":["Paket halüsinasyonu / slopsquatting — modelin uydurduğu paket adının saldırganca kaydedilmesi.","Tedarik zinciri (supply chain) — koda giren her dış bileşen."],"techniques":["LLM04-002"],"do":"Katalogda 'paket' ve 'tedarik' araması yap; bulduklarının hangi katta olduğunu ve neden orada olduğunu söyle."}],"checkpoint":{"areas":["LLM10","LLM04"],"count":10,"pass":75},"order":8},{"id":"M09","title":"Zehirleme ve RAG — bilgiyi kaynağından bozmak","goal":"LLM05 (eğitim verisi) ile LLM09 (getirme/vektör) ayrımını net kurmak. Sınavda en çok karıştırılan yer burası.","level":"ileri","areas":["LLM05","LLM09"],"sections":[{"id":"M09-1","title":"İki ayrı an: eğitim anı ve sorgu anı","body":"Aynı fikir (bilgiyi bozmak) iki farklı anda uygulanır:\n\n• EĞİTİM ANI (LLM05) — veri kümesine zararlı örnek sokarsın, model ağırlıkları değişir. Tetikleyiciye bağlı arka kapı (BadNets), kavram bozma (Nightshade), ince ayar verisi zehirleme. Etkisi kalıcıdır, modelle birlikte dağıtılır.\n\n• SORGU ANI (LLM09) — ağırlıklara dokunmazsın; modelin o anda çektiği bilgi tabanına doküman eklersin (PoisonedRAG). Getirme aşaması senin dokümanını 'en alakalı' bulur, model de onu kaynak göstererek cevaplar.\n\nAyrımın kolay testi: ağırlıklar değişti mi? Değiştiyse LLM05, değişmediyse LLM09.","analogy":"Birini kandırmanın iki yolu: ya çocukluğundan yanlış öğretirsin (eğitim), ya da tam soru sorulacakken masasına sahte bir rapor koyarsın (getirme). İkincisi çok daha ucuz ve çok daha hızlıdır.","attacker":"Gerçek hayatta LLM09 daha erişilebilirdir: kurumsal wiki'ye yazabilen herkes bilgi tabanını zehirleyebilir. Eğitim verisine erişim ise genelde tedarik zinciri üzerinden (LLM04) gelir.","terms":["PoisonedRAG — getirme aşamasını ele geçiren doküman zehirlemesi.","Arka kapı (backdoor) — tetikleyici görülünce devreye giren gizli davranış.","Gömülü (embedding) — metnin anlamsal vektör karşılığı; benzerlik buradan hesaplanır."],"techniques":["LLM09-001","LLM05-002"],"do":"Sınavda LLM05 ve LLM09'dan 20 soru çöz. Hedefin: bu iki katta hiç yanlış yapmamak."},{"id":"M09-2","title":"Bilgi tabanı bir güven sınırıdır","body":"RAG kuran ekiplerin çoğu, vektör veritabanını bir 'depo' sanır. Oysa orası modelin gerçek kabul ettiği her şeyin kaynağıdır — yani bir güven sınırı.\n\nSorulacak sorular: bu tabana kim yazabiliyor? İçerik indekslenmeden önce gözden geçiriliyor mu? Kullanıcı yetkisi getirme aşamasında uygulanıyor mu (yoksa herkes her dokümanı çekebiliyor mu)? Doküman kaynağı kullanıcıya gösteriliyor mu? Çelişen kaynaklar ne oluyor?","analogy":"Şirketin duyuru panosu gibi: kilitli değilse, oraya asılan sahte duyuru resmî duyuru gibi okunur. Model panoya asılanı sorgulamaz.","attacker":"Zehirli dokümanı yazarken hedef sorulara gömülü uzayda YAKIN olmalısın: aynı terimleri, aynı soru kalıplarını kullan, 'bu sayfa günceldir/önceliklidir' gibi ifadeler serpiştir. Amaç ikna etmek değil, GETİRİLMEK.","terms":["RAG — sorgu anında dış bilgi getirip modele veren mimari.","Yetki-farkında getirme — kullanıcının erişebildiği dokümanların filtrelenmesi.","Kaynak gösterme (citation) — modelin hangi dokümana dayandığını belirtmesi."],"do":"Senaryolar'dan 'Şirket içi asistan' senaryosunu oku. Sonra kendi cümlenle yaz: bu olay neden LLM05 değil?"}],"checkpoint":{"areas":["LLM05","LLM09"],"count":12,"pass":80},"order":9},{"id":"M10","title":"Tüketim ve yanlış bilgi — teknik olmayan ama pahalı olan","goal":"Para ve itibar üzerinden etki yaratan iki katı ciddiye almak.","level":"orta","areas":["LLM06","LLM07"],"sections":[{"id":"M10-1","title":"Cüzdan reddi: sistemi çökertmeden iflas ettirmek","body":"LLM çağrıları pahalıdır ve maliyet token başınadır. Saldırgan sunucuyu düşürmeye çalışmaz; uzun bağlam, 'adım adım düşün' yönergeleri, özyinelemeli görevler ve paralel isteklerle faturayı şişirir. Akademik adı sponge examples, sektördeki adı denial of wallet.\n\nAjan sistemlerinde daha beteri var: modelin kendi kendine araç çağırarak döngüye girmesi. Tek bir kullanıcı isteği, yüzlerce çağrıya dönüşebilir.","analogy":"Bir restoranı kapatmak için kapısını kilitlemene gerek yok; her masaya oturup en uzun süren yemeği sipariş edip ödememen yeter.","attacker":"Testte ölçülebilir ol: 'X isteğiyle Y token tüketildi, Z dolar' cümlesini kurabiliyorsan bulgun vardır. Ama izinsiz yük testi yapma — bu kat özellikle yazılı onay ister.","terms":["Denial of Wallet — maliyet üzerinden hizmet dışı bırakma.","Sponge examples — hesaplamayı azami zorlayan girdiler.","Kota/rate limit — kullanıcı başına istek ve token sınırı."],"techniques":["LLM06-001"],"do":"Kullandığın bir API'de 1000 tokenlık ve 50.000 tokenlık isteğin maliyet farkını hesapla. Sınırsız bir uçta bunun günlük karşılığını çıkar."},{"id":"M10-2","title":"Halüsinasyon bir güvenlik konusudur","body":"Model uydurduğunda bu 'sadece yanlış cevap' değildir. Air Canada davasında bot olmayan bir iade politikası anlattı; mahkeme şirketi sorumlu tuttu (Moffatt v. Air Canada, 2024). Chevrolet bayisinin botu bir aracı 1 dolara 'sattı'. Avukatlar mahkemeye uydurma dava kararları sundu.\n\nGüvenlik açısından üç etki: hukuki bağlayıcılık, itibar kaybı, ve kritik karar zinciri (tıbbi, finansal, hukuki) bozulması. Red team raporunda halüsinasyon bulgusu yazarken etkisini bu üç başlıkla göstermelisin.","analogy":"Kurumsal antetli kâğıda yazılmış yanlış bilgi, sözlü bir hatadan farklıdır. Bot, kurumun antetli kâğıdıdır.","attacker":"Hedefi 'saçmalatmak' değil, KURUMU BAĞLAYAN bir cümle söyletmektir: fiyat taahhüdü, iade sözü, garanti, hukuki yorum. Ekran görüntüsü raporun kanıtıdır.","terms":["Halüsinasyon — modelin gerçek olmayan bilgiyi emin bir dille üretmesi.","Temellendirme (grounding) — cevabı kaynak belgeye dayandırma.","Aşırı güven (overreliance) — kullanıcının çıktıyı doğrulamadan kullanması."],"techniques":["LLM07-001"],"do":"Bir kurum botuna (izinli, kendi hesabında) politika sorusu sor ve kaynağını iste. Kaynak veremiyorsa bu neden bulgudur, yaz."}],"checkpoint":{"areas":["LLM06","LLM07"],"count":10,"pass":75},"order":10},{"id":"M11","title":"Araçlar — elle deneme bitti, ölçekle","goal":"Cephanelikteki araçları gerçek bir iş akışına oturtmak.","level":"ileri","areas":["TOOLS"],"sections":[{"id":"M11-1","title":"Tarayıcılar: garak, promptfoo, PyRIT","body":"Elle 20 payload denemek öğreticidir ama ölçeklenmez. Üç araç üç farklı iş yapar:\n\n• garak (NVIDIA) — LLM zafiyet tarayıcısı. Hazır probe'larla tarar, rapor üretir. 'Bu modelde hangi bilinen zafiyet sınıfı tutuyor?' sorusunun cevabı.\n• promptfoo — değerlendirme/regresyon. 'Bu promptu değiştirdim, güvenlik davranışı bozuldu mu?' sorusunun cevabı; CI'a takılır.\n• PyRIT (Microsoft) — çok turlu, uyarlanabilir red team senaryoları ve puanlayıcı mimarisi. 'Otomatik bir saldırgan kurayım' dediğinde.\n\nBu üçünü karıştırmak mülakatta ilk elenme sebebidir.","analogy":"nmap, birim testi ve bir sparring partneri. Üçü de dövüşe hazırlar ama aynı şey değildir.","attacker":"Önce elle bir zafiyet bul, sonra aracı o zafiyeti ARAMAK için kullan. Araçla başlayan red team, aracın bildiğinden fazlasını asla bulamaz.","terms":["Probe — tarayıcının denediği hazır saldırı kalıbı.","ASR (attack success rate) — denemelerin başarı oranı; raporun temel metriği.","Regresyon testi — daha önce kapatılan davranışın geri gelip gelmediğini ölçme."],"do":"garak'ı kur ve yerel bir modele (LM Studio/Ollama) tek bir probe ile tara. Çıkan raporu oku: hangi probe geçti, hangisi kaldı?"},{"id":"M11-2","title":"Savunma tarafını da bil: guardrail'ler","body":"Red teamer, savunmayı bilmeden iyi rapor yazamaz. Temel katman isimleri: Llama Guard (içerik politikası sınıflandırma), Prompt Guard (injection/jailbreak tespiti), NeMo Guardrails (akış/konu kısıtlama), Rebuff/Vigil (injection tespiti), LLM Guard (girdi-çıktı filtre zinciri), Presidio (PII maskeleme), Guardrails AI (çıktı şeması zorlama).\n\nHer birinin ne YAPMADIĞINI bilmek daha önemlidir: içerik sınıflandırıcı, aşırı yetkiyi engellemez; injection dedektörü, kötü çıktı render'ını düzeltmez. Savunma katmanları birbirinin yerine geçmez.","analogy":"Yangın alarmı, yangın kapısı ve söndürücü. Üçü de yangına karşıdır ama biri diğerinin işini yapmaz. Bir binada sadece alarm varsa, rapora 'alarm var' diye değil 'kapı yok' diye yazarsın.","attacker":"Bir savunma gördüğünde önce sınıfını belirle, sonra o sınıfın bilinen kör noktasına git: sınıflandırıcıya gizleme, tek-mesaj filtresine çok turlu tırmanma, anahtar kelime filtresine kodlama.","terms":["Guardrail — model çevresindeki politika/filtre katmanı.","Defense in depth — tek kontrole güvenmeyip katman kurma.","Yanlış pozitif — savunmanın meşru kullanımı engellemesi; aşırı sıkı filtrenin bedeli."],"do":"Cephanelik Testi'ni (araç drill) 20 soru çöz. Hedef: her aracın ne yaptığını ve ne yapmadığını ayırt etmek."},{"id":"M11-3","title":"Bulgu yazımı: işi burada alırsın","body":"Teknik beceri seni mülakata sokar, rapor seni işte tutar. Bir AI red team bulgusunun iskeleti:\n\n1. BAŞLIK — etkiyi söyleyen tek cümle. ('Dolaylı prompt injection ile kullanıcı e-postalarının dışarı sızdırılması')\n2. ETKİ — kim ne kaybeder, hangi veri, hangi yetki.\n3. ADIMLAR — tekrar edilebilir, en küçük PoC. Model çıktısı değişken olduğu için başarı oranını da yaz ('10 denemenin 7'si').\n4. KANIT — ekran görüntüsü, istek/yanıt, log.\n5. KÖK NEDEN — hangi kat, hangi güven varsayımı yanlış.\n6. ÖNERİ — uygulanabilir, sıralı, maliyetiyle birlikte.\n\nDeterministik olmayan bir sistemi test ettiğin için başarı oranı ve model sürümü/sıcaklık gibi koşulları yazmak zorundasın; yoksa savunmacı tekrar üretemez ve bulgu kapanır.","analogy":"Doktorun teşhisi değil, reçetesi hastayı iyileştirir. Rapor senin reçetendir.","attacker":"Her pratik oturumunun sonunda 5 satırlık bir bulgu yaz. Gandalf'ı geçmek bir şey öğretir; nasıl geçtiğini yazmak onu kalıcı yapar.","terms":["PoC — kavram kanıtı; en küçük tekrarlanabilir gösterim.","CVSS / risk derecelendirme — etkiyi standart bir ölçeğe oturtma.","Determinizm eksikliği — aynı girdinin farklı çıktı vermesi; AI raporlarının en büyük farkı."],"do":"Bugüne kadar çözdüğün bir lab için yukarıdaki 6 maddelik raporu yaz. Kısa olsun ama altı madde de dolsun."}],"checkpoint":{"areas":["TOOLS"],"count":12,"pass":75},"order":11},{"id":"M12","title":"Angajman — baştan sona bir AI red team işi","goal":"Öğrendiklerini tek bir akışta birleştirmek; gerçek bir işte ne yapacağını bilmek.","level":"ileri","areas":["LLM01","LLM03","LLM10","TOOLS"],"sections":[{"id":"M12-1","title":"Akış: kapsam → keşif → hipotez → deneme → zincir → rapor","body":"Gerçek bir angajman şöyle işler:\n\n1. KAPSAM — hangi uygulama, hangi hesap, hangi veri, ne zaman. Yazılı.\n2. KEŞİF — parmak izi, sistem promptu, araç listesi, giriş kanalları, çıktı render'ı.\n3. HİPOTEZ — 'şu kanaldan yazarsam, şu aracı çağırtırım, şu veriyi çıkarırım.' Her hipotez bir kat ve bir etki içerir.\n4. DENEME — en az gürültülüden başla. Başarı oranını kaydet.\n5. ZİNCİR — tek bulgu yerine zincir kur: LLM01 → LLM03 → LLM10.\n6. RAPOR — etki sıralı, tekrar edilebilir, öneriyle.\n\nAcemi 4. adımdan başlar ve payload denemekle vakit harcar. Profesyonel 2 ve 3'e zaman ayırır.","analogy":"İyi avcı çok koşan değil, izi doğru okuyandır.","attacker":"Her denemeden sonra tek soru: 'bu bana hedef hakkında ne öğretti?' Cevap yoksa deneme boşa gitmiştir.","terms":["Angajman (engagement) — sözleşmeli, süreli güvenlik testi.","Kill chain — bulguların birbirini besleyen zinciri."],"do":"AI Goat veya Damn Vulnerable LLM Agent'ı kur. Yukarıdaki 6 adımı baştan sona uygula ve bir rapor çıkar."},{"id":"M12-2","title":"Sonraki durak: sertifika ve portföy","body":"Bu yolu bitirdiğinde elinde üç şey olmalı: kat taksonomisine hâkimiyet, yasal hedeflerde çözülmüş lab'ler, ve yazılmış bulgular.\n\nBundan sonrası için: HTB Academy'nin AI Red Teamer yolu (Google SAIF hizalı, 12 modül) bu müfredatın uygulamalı ve sertifikalı karşılığıdır — burada öğrendiğin her kat orada bir modüle denk gelir. TryHackMe'nin AI Security yolu daha hafif bir giriş sunar. PortSwigger'ın LLM lab'leri ücretsizdir ve web tarafını da güçlendirir.\n\nPortföy için: çözdüğün her lab'in kısa bir writeup'ını yaz. On writeup, bir sertifikadan daha ikna edicidir — çünkü düşünme biçimini gösterir.","analogy":"Sertifika ehliyettir; portföy ise kaç kilometre yaptığındır. İşe alan ikincisine bakar.","attacker":"Kendine bir hedef koy: her hafta bir teknik + bir lab + bir writeup. 12 hafta sonra hem bu uygulamanın kapsamasını kapatmış hem bir portföyün olmuş olur.","terms":["Writeup — bir zafiyeti nasıl bulduğunu anlatan teknik yazı.","SAIF — Google'ın Secure AI Framework'ü; HTB yolu buna hizalı."],"do":"Pratik Hedefler'den HTB AI Red Teamer ve THM AI Security kartlarını oku, birini seç ve bu hafta ilk modülünü bitir."},{"id":"M12-3","title":"Sahada kanıtla: yarışmalar ve ödüllü av","body":"Lab'ler sana tekniği öğretir ama sonucu önceden bilinen, herkesin çözdüğü hedeflerdir. Yarışmalar farklı: hedef yeni, savunma gerçek ve seni başkalarıyla aynı tabloda ölçüyorlar.\n\nÜç basamak var:\n\n1. ISINMA — HackAPrompt'un Tutorial parkuru ve Gandalf: Agent Breaker. Ücretsiz, rehberli, hata yapmak bedava.\n2. YARIŞMA — Gray Swan Arena. Büyük laboratuvarların modellerini ve ajanlarını kıran binlerce kişiyle aynı liderlik tablosundasın. En iyiler Gray Swan'ın ücretli red team ağına davet ediliyor; yani burası doğrudan işe açılan bir kapı.\n3. ÖDÜLLÜ AV — 0DIN gibi GenAI bug bounty programları. Artık kurgusal bir bayrak değil, gerçek bir modelde tekrarlanabilir bir bulgu gönderiyorsun ve doğrulanırsa para alıyorsun.\n\nHer basamakta bir öncekinin çıktısını kullan: lab'de öğrendiğin tekniği yarışmada dene, yarışmada tuttuğun notu bug bounty raporuna çevir.","analogy":"Lab'ler antrenman sahası, yarışma maç, bug bounty ise profesyonel lig. Antrenmanda iyi olan herkes maçta iyi olmaz; fark maçta ortaya çıkar.","attacker":"Yarışmada kazananlar en çok payload bilenler değil, en hızlı keşif yapanlar. İlk 10 dakikayı savunmayı anlamaya ayır: filtre girdide mi çıktıda mı, model neyi reddediyor, hangi kelimeler tetikliyor. Payload'ı ondan sonra seç.","terms":["Behavior (davranış) — yarışmada modele yaptırman gereken tek bir yasaklı eylem; her kırılan davranış puan.","Liderlik tablosu — yarışmadaki sıralama; CV'de somut kanıt.","Bug bounty — gerçek sistemde bulunan açığı sorumlu şekilde bildirip ödül alma programı."],"do":"Pratik Hedefler'de YARIŞMA ve ÖDÜLLÜ AV kartlarını aç. Bu hafta HackAPrompt Tutorial parkurunu bitir, sonra Gray Swan Arena'da hesap açıp açık yarışmaya bir kez gir."}],"checkpoint":{"areas":["LLM01","LLM03","LLM10","TOOLS"],"count":20,"pass":80},"order":12}]}</script>
<script>
(() => {
"use strict";
const SEED = JSON.parse(document.getElementById("seed").textContent);
const CATS = SEED.categories;                 // {LLM01: "Prompt Injection", ...}
const CAT_KEYS = Object.keys(CATS);
const TOOL_AREA = "TOOLS";
const AREAS = CAT_KEYS.concat([TOOL_AREA]);
const AREA_NAME = Object.assign({}, CATS, {TOOLS: "Cephanelik"});
const GOAL = 20;
const BOX_DAYS = {1:1, 2:2, 3:4, 4:8, 5:16};   // en kısa aralık 1 gün (aynı gün = hatırlama, öğrenme değil)
const CVAR = {}; CAT_KEYS.forEach((c,i) => CVAR[c] = "var(--c" + (i+1) + ")");
const TOOL_TYPE = {offense:"Saldırı aracı", defense:"Savunma aracı",
                   both:"Hem saldırı hem savunma", framework:"Çerçeve / bilgi kaynağı"};

/* ================= durum ================= */
const state = {
  attacks: SEED.attacks || [],
  tools: SEED.tools || [],
  practice: SEED.practice || [],
  questions: (SEED.questions || []).slice(),
  scenarios: (SEED.scenarios || []).slice(),
  path: (SEED.path || []),
  notes: [],
  reports: [],
  progress: emptyProgress(),
  token: "", gist: null, syncMsg: "", tab: "path",
  exam: null, saving: false, dirty: false,
};

function emptyProgress(){
  return {items:{}, by_category:{}, daily:{day:today(), per:{}, total:0},
          streak:0, best_streak:0, last_day:null, seen:0, correct:0, mastery:{},
          path:{read:{}, done:{}}};
}
function today(){ const d = new Date(); return d.getFullYear() + "-" +
  String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); }
function daysSince(iso){
  if(!iso) return 9999;
  const a = new Date(iso + "T00:00:00"), b = new Date(today() + "T00:00:00");
  return Math.round((b - a) / 86400000);
}
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const trim = (s,n) => { s = String(s||"").replace(/\s+/g," ").trim();
  return s.length <= n ? s : s.slice(0,n-1).trimEnd() + "…"; };
const shuffle = a => { for(let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1));
  [a[i],a[j]] = [a[j],a[i]]; } return a; };

/* ================= yerel saklama ================= */
const LS = "aisec-cep-progress-v1";
function loadLocal(){

/* ================= ilerleme birleştirme (telefon ↔ masaüstü) ================= */
function mergeProgress(a, b){
  if(!a) return b; if(!b) return a;
  const out = {items:{}, by_category:{}, mastery:{},
    daily:{day:today(), per:{}, total:0},
    streak: Math.max(a.streak||0, b.streak||0),
    best_streak: Math.max(a.best_streak||0, b.best_streak||0),
    last_day: (a.last_day||"") > (b.last_day||"") ? a.last_day : b.last_day,
    seen: Math.max(a.seen||0, b.seen||0), correct: Math.max(a.correct||0, b.correct||0)};
  const keys = new Set(Object.keys(a.items||{}).concat(Object.keys(b.items||{})));
  keys.forEach(k => {
    const x = (a.items||{})[k], y = (b.items||{})[k];
    if(!x || !y){ out.items[k] = x || y; return; }
    // aynı gün eşitliğinde: sonucu bilinen (yeni biçim) kayıt, o da eşitse temkinli olan (düşük kutu)
    const newer = (x.last||"") !== (y.last||"") ? ((x.last||"") > (y.last||"") ? x : y)
      : (!!x.last_result !== !!y.last_result ? (x.last_result ? x : y)
      : ((x.box||1) <= (y.box||1) ? x : y));
    out.items[k] = {n:Math.max(x.n||0,y.n||0), ok:Math.max(x.ok||0,y.ok||0),
      bad:Math.max(x.bad||0,y.bad||0), elim:Math.max(x.elim||0,y.elim||0),
      box:newer.box||1, last:newer.last||null};
    if(newer.last_result) out.items[k].last_result = newer.last_result;
  });
  AREAS.forEach(c => {
    const x = (a.by_category||{})[c], y = (b.by_category||{})[c];
    if(x || y) out.by_category[c] = {seen:Math.max((x||{}).seen||0,(y||{}).seen||0),
                                     correct:Math.max((x||{}).correct||0,(y||{}).correct||0)};
  });
  Object.assign(out.mastery, b.mastery||{}, a.mastery||{});
  out.path = {read:{}, done:{}};
  [b, a].forEach(src => {
    Object.assign(out.path.read, ((src||{}).path||{}).read || {});
    Object.assign(out.path.done, ((src||{}).path||{}).done || {});
  });
  const da = (a.daily||{}), dbb = (b.daily||{});
  [da, dbb].forEach(d => {
    if(d.day !== today()) return;
    Object.keys(d.per || {}).forEach(k =>
      out.daily.per[k] = Math.max(out.daily.per[k]||0, d.per[k]||0));
  });
  out.daily.total = Object.values(out.daily.per).reduce((s,v) => s+v, 0);
  return out;
}

/* ================= soru motoru (quizgen portu) ================= */
const A_TMPL = ["story2cat","story2tech","tech2cat","payload2tech","why2tech",
                "mitig2tech","case2tech","tech2mitig","cat2tech"];
const NEED = {story2cat:"story", story2tech:"story", payload2tech:"example",
              why2tech:"why", mitig2tech:"mitigation", case2tech:"real_case",
              tech2mitig:"mitigation"};

function buildSpecs(){
  const out = [];
  state.attacks.forEach(a => {
    if(!a.id || !CATS[a.category]) return;
    A_TMPL.forEach(t => {
      const need = NEED[t];
      if(need && !String(a[need]||"").trim()) return;
      out.push({key:a.id + "|" + t, tmpl:t, area:a.category, src:a.id});
    });
  });
  state.tools.forEach(t => {
    if(!t.id) return;
    ["func2tool","tool2func","tool2type"].forEach(k =>
      out.push({key:t.id + "|" + k, tmpl:k, area:TOOL_AREA, src:t.id}));
  });
  CAT_KEYS.forEach(c => ["code2name","name2code"].forEach(k =>
    out.push({key:c + "|" + k, tmpl:k, area:c, src:c})));
  state.questions.forEach(q => {
    if(q && q.id) out.push({key:q.id + "|hand", tmpl:"hand", area:q.area, src:q.id});
  });
  return out;
}

const findAttack = id => state.attacks.find(a => a.id === id);
const findTool = id => state.tools.find(t => t.id === id);

function distinctPick(pool, correct, n, keyf){
  const seen = new Set([String(keyf(correct)||"").trim().toLowerCase()]);
  const out = [];
  for(const it of pool){
    if(out.length >= n) break;
    const v = String(keyf(it)||"").trim();
    if(!v || seen.has(v.toLowerCase())) continue;
    seen.add(v.toLowerCase()); out.push(it);
  }
  return out;
}
function siblings(entry){
  const same = shuffle(state.attacks.filter(a => a.category === entry.category && a.id !== entry.id));
  const other = shuffle(state.attacks.filter(a => a.category !== entry.category));
  return same.concat(other);
}
function finish(spec, area, prompt, ctx, opts, correct, extra){
  opts = opts.filter(o => String(o||"").trim());
  if(opts.length < 3) return null;
  const shuffled = shuffle(opts.slice());
  return Object.assign({key:spec.key, tmpl:spec.tmpl, area, prompt,
    context:ctx || "", options:shuffled, answer:shuffled.indexOf(correct)}, extra || {});
}

function makeQuestion(spec){
  const t = spec.tmpl;
  if(t === "hand"){
    const q = state.questions.find(x => x.id === spec.src);
    if(!q || !q.options || q.options.length < 3) return null;
    const correct = q.options[q.answer];
    return finish(spec, q.area, q.prompt, q.context, q.options.slice(), correct,
      {hand:q, entry: q.source_id ? findAttack(q.source_id) : null});
  }
  if(t === "code2name" || t === "name2code"){
    const cat = spec.src, name = CATS[cat];
    const others = shuffle(CAT_KEYS.filter(c => c !== cat)).slice(0,3);
    if(t === "code2name")
      return finish(spec, cat, "OWASP LLM Top 10: '" + cat + "' hangi kategoridir?", "",
        [name].concat(others.map(c => CATS[c])), name);
    return finish(spec, cat, "OWASP LLM Top 10: '" + name + "' hangi koddur?", "",
      [cat].concat(others), cat);
  }
  if(t === "func2tool" || t === "tool2func" || t === "tool2type"){
    const tool = findTool(spec.src); if(!tool) return null;
    const pool = shuffle(state.tools.filter(x => x.id !== spec.src));
    if(t === "func2tool"){
      if(!String(tool.what||"").trim()) return null;
      const ds = distinctPick(pool, tool, 3, x => x.name);
      return finish(spec, TOOL_AREA, "Şu işi yapan araç hangisidir?", trim(tool.what,420),
        [tool.name].concat(ds.map(d => d.name)), tool.name, {tool});
    }
    if(t === "tool2func"){
      const correct = trim(tool.what, 170);
      const ds = distinctPick(pool, tool, 3, x => trim(x.what,170));
      return finish(spec, TOOL_AREA, "'" + tool.name + "' aracı ne işe yarar?", "",
        [correct].concat(ds.map(d => trim(d.what,170))), correct, {tool});
    }
    const correct = TOOL_TYPE[tool.type] || "Bilinmiyor";
    const opts = [correct].concat(Object.values(TOOL_TYPE).filter(v => v !== correct)).slice(0,4);
    return finish(spec, TOOL_AREA, "'" + tool.name + "' aracı hangi türdendir?",
      trim(tool.what,220), opts, correct, {tool});
  }
  const e = findAttack(spec.src); if(!e) return null;
  const cat = e.category, catLabel = cat + " — " + CATS[cat];
  const sib = siblings(e);
  const techOpts = () => [e.technique].concat(
    distinctPick(sib, e, 3, a => a.technique).map(a => a.technique));
  const catOpts = () => [catLabel].concat(
    shuffle(CAT_KEYS.filter(c => c !== cat)).slice(0,3).map(c => c + " — " + CATS[c]));

  switch(t){
    case "story2cat":
      return finish(spec, cat, "Bu olay hangi OWASP LLM kategorisine girer?", e.story, catOpts(), catLabel, {entry:e});
    case "story2tech":
      return finish(spec, cat, "Anlatılan saldırı tekniği hangisidir?", e.story, techOpts(), e.technique, {entry:e});
    case "tech2cat":
      return finish(spec, cat, "'" + e.technique + "' tekniği hangi kata girer?", "", catOpts(), catLabel, {entry:e});
    case "payload2tech":
      return finish(spec, cat, "Aşağıdaki payload / iz hangi tekniğe aittir?", trim(e.example,500),
        techOpts(), e.technique, {entry:e, payload:true});
    case "why2tech":
      return finish(spec, cat, "Bu açıklama hangi tekniğin NEDEN çalıştığını anlatır?", e.why,
        techOpts(), e.technique, {entry:e});
    case "mitig2tech":
      return finish(spec, cat, "Bu önlem hangi saldırıya karşı alınır?", e.mitigation,
        techOpts(), e.technique, {entry:e});
    case "case2tech":
      return finish(spec, cat, "Bu gerçek olay hangi tekniğe örnektir?", e.real_case,
        techOpts(), e.technique, {entry:e});
    case "tech2mitig": {
      const correct = trim(e.mitigation,170);
      if(!correct) return null;
      const ds = distinctPick(sib.filter(a => String(a.mitigation||"").trim()), e, 3,
        a => trim(a.mitigation,170));
      return finish(spec, cat, "'" + e.technique + "' saldırısına karşı doğru önlem hangisidir?", "",
        [correct].concat(ds.map(d => trim(d.mitigation,170))), correct, {entry:e});
    }
    case "cat2tech": {
      const others = shuffle(state.attacks.filter(a => a.category !== cat));
      const ds = distinctPick(others, e, 3, a => a.technique);
      return finish(spec, cat, "Aşağıdakilerden hangisi " + catLabel + " kapsamındadır?", "",
        [e.technique].concat(ds.map(d => d.technique)), e.technique, {entry:e});
    }
  }
  return null;
}

/* ---- seçim: elle yazılan → yanlışlar → tekrarı gelen → havuz ---- */
function itemStat(key){
  const r = state.progress.items[key];
  return r ? {n:r.n||0, ok:r.ok||0, bad:r.bad||0, elim:r.elim||0, box:r.box||1, last:r.last||null}
           : {n:0, ok:0, bad:0, elim:0, box:1, last:null};
}
function catAcc(){
  const out = {};
  AREAS.forEach(c => {
    const r = state.progress.by_category[c];
    out[c] = (r && r.seen) ? r.correct / r.seen : null;
  });
  return out;
}
function specWeight(spec, acc){
  const st = itemStat(spec.key);
  let w;
  if(!st.n) w = 3.0;
  else if(daysSince(st.last) >= (BOX_DAYS[st.box] || 0)) w = 2.2 + 0.8*st.bad + 0.6*st.elim;
  else w = 0.1;
  const a = acc[spec.area];
  w *= (a === null || a === undefined) ? 1.8 : (1 + (1-a)*1.5);
  if(spec.tmpl === "hand") w *= 1.4;
  return Math.max(w, 0.01);
}
function weightedTake(pool, weights, n, usedSrc, maxPerSrc){
  const out = []; const list = pool.slice();
  while(list.length && out.length < n){
    let total = 0; list.forEach(s => total += weights[s.key]);
    if(total <= 0) break;
    let r = Math.random()*total, idx = list.length-1;
    for(let i=0;i<list.length;i++){ r -= weights[list[i].key]; if(r <= 0){ idx = i; break; } }
    const s = list.splice(idx,1)[0];
    if((usedSrc[s.src]||0) >= maxPerSrc) continue;
    usedSrc[s.src] = (usedSrc[s.src]||0) + 1;
    out.push(s);
  }
  return out;
}
/* Ezber/hatırlama koruması — masaüstündeki quizgen.pick_batch ile aynı kurallar:
   bugün yanlış/eleyerek yapılan teknik bugün HİÇ gelmez; aynı soru aynı gün
   iki kez gelmez; zayıf teknik vadesi gelince FARKLI kalıpla (ayna hariç) gelir;
   sınavda teknik başına 1, günde en fazla 2 soru. */
const MIRROR = {mitig2tech:"tech2mitig", tech2mitig:"mitig2tech",
  code2name:"name2code", name2code:"code2name", func2tool:"tool2func",
  tool2func:"func2tool", story2cat:"tech2cat", tech2cat:"story2cat"};
const DAY_CAP = 2;
function isWeak(r){
  if(r.last_result) return r.last_result === "bad" || r.last_result === "elim";
  return !!(r.bad || r.elim) && (r.box || 1) <= 1;
}
const isDue = r => daysSince(r.last) >= (BOX_DAYS[r.box || 1] || 1);
function dayState(){
  const t = today(), wrong = new Set(), seen = new Set(), srcToday = {}, weak = {};
  Object.entries(state.progress.items || {}).forEach(([key, r]) => {
    if(!r) return;
    const i = key.indexOf("|"), src = key.slice(0, i), tmpl = key.slice(i+1);
    if(r.last === t){
      seen.add(key); srcToday[src] = (srcToday[src]||0) + 1;
      if(r.last_result === "bad" || r.last_result === "elim" ||
         (!r.last_result && (r.bad || r.elim))) wrong.add(src);
    }
    if(isWeak(r)){
      const w = weak[src] || (weak[src] = {failed:new Set(), due:true});
      w.failed.add(tmpl);
      if(!isDue(r)) w.due = false;
    }
  });
  return {wrong, seen, srcToday, weak};
}
function pickBatch(specs, n, area){
  const pool = specs.filter(s => !area || s.area === area);
  if(!pool.length) return [];
  const ds = dayState(), items = state.progress.items || {};
  const avail = pool.filter(s => !ds.wrong.has(s.src) && !ds.seen.has(s.key) &&
                                 (ds.srcToday[s.src]||0) < DAY_CAP);
  if(!avail.length) return [];
  const acc = catAcc(), weights = {};
  avail.forEach(s => weights[s.key] = specWeight(s, acc));
  const bySrc = {};
  avail.forEach(s => (bySrc[s.src] = bySrc[s.src] || []).push(s));

  const fresh = avail.filter(s => s.tmpl === "hand" && !items[s.key]);
  const comeback = [];
  Object.entries(ds.weak).forEach(([src, w]) => {
    if(!w.due || !bySrc[src]) return;
    let c = bySrc[src].filter(s => !w.failed.has(s.tmpl) && !w.failed.has(MIRROR[s.tmpl]));
    if(!c.length) c = bySrc[src].slice();
    c.sort((a,b) => ((items[a.key]||{}).n||0) - ((items[b.key]||{}).n||0) || Math.random()-0.5);
    comeback.push(c[0]);
  });
  const handDue = avail.filter(s => s.tmpl === "hand" && items[s.key] && isDue(items[s.key]));
  const taken = new Set(fresh.concat(comeback, handDue).map(s => s.key));
  const rest = avail.filter(s => !taken.has(s.key));

  const used = {}; let out = [];
  [fresh, comeback, handDue, rest].forEach(g => {
    if(out.length >= n) return;
    out = out.concat(weightedTake(g, weights, n - out.length, used, 1));
  });
  if(out.length < n){                       // ince katta ikinci (farklı kalıp) soruya izin
    const have = new Set(out.map(s => s.key));
    const usedDay = Object.assign({}, ds.srcToday);
    Object.entries(used).forEach(([k,v]) => usedDay[k] = (usedDay[k]||0) + v);
    out = out.concat(weightedTake(avail.filter(s => !have.has(s.key)), weights,
                                  n - out.length, usedDay, DAY_CAP));
  }
  return out;
}

function record(q, correct, sure){
  const p = state.progress;
  const _kvBefore = {best: p.best_streak || 0, area: q.area || TOOL_AREA};
  if(p.daily.day !== today()) p.daily = {day:today(), per:{}, total:0};
  const rec = p.items[q.key] || {n:0, ok:0, bad:0, elim:0, box:1, last:null};
  rec.n++;
  if(correct && sure){ rec.ok++; rec.box = Math.min(5, rec.box + 1); rec.last_result = "ok"; }
  else if(correct){ rec.ok++; rec.elim++; rec.box = 1; rec.last_result = "elim"; }
  else { rec.bad++; rec.box = 1; rec.last_result = "bad"; }
  rec.last = today();
  p.items[q.key] = rec;

  const area = q.area || TOOL_AREA;
  p.daily.per[area] = (p.daily.per[area]||0) + 1;
  p.daily.total++;
  const bc = p.by_category[area] || {seen:0, correct:0};
  bc.seen++; if(correct && sure) bc.correct++;
  p.by_category[area] = bc;
  p.seen++; if(correct && sure) p.correct++;

  if(p.last_day !== today()){
    const d = daysSince(p.last_day);
    p.streak = (p.last_day && d === 1) ? (p.streak||0) + 1 : 1;
    p.best_streak = Math.max(p.best_streak||0, p.streak);
    p.last_day = today();
  }
  saveLocal(); scheduleSync(); paintTop();
  try{ KV.onRecord(correct, sure, _kvBefore); }catch(e){}
}

function planRows(){
  const p = state.progress;
  if(p.daily.day !== today()) p.daily = {day:today(), per:{}, total:0};
  return AREAS.map(a => {
    const done = p.daily.per[a] || 0;
    return {area:a, done, goal:GOAL, ok: done >= GOAL};
  });
}
function nextArea(){
  const acc = catAcc();
  const left = planRows().filter(r => !r.ok)
    .map(r => [r.goal - r.done, acc[r.area] === null || acc[r.area] === undefined ? -1 : acc[r.area], r.area]);
  if(!left.length) return null;
  left.sort((x,y) => (y[0]-x[0]) || (x[1]-y[1]));
  return left[0][2];
}
function weakAreas(n){
  const acc = catAcc(), rows = [];
  AREAS.forEach(a => {
    const r = state.progress.by_category[a] || {};
    if(!r.seen) rows.push([-1, a]);
    else if(r.seen >= 3) rows.push([acc[a], a]);
  });
  rows.sort((x,y) => x[0]-y[0]);
  return rows.slice(0, n||3).map(r => r[1]);
}
function practiceFor(cat){
  const order = {free:0, "free-tier":1, paid:2};
  return state.practice
    .filter(t => !cat || (t.areas||[]).includes(cat))
    .sort((a,b) => (order[a.cost] ?? 3) - (order[b.cost] ?? 3));
}
function lessonText(e){
  const out = [];
  out.push(e.category + " — " + (CATS[e.category]||""));
  out.push("TEKNİK: " + e.technique);
  if(e.story) out.push("\nSENARYO: " + e.story);
  if(e.why) out.push("\nNEDEN ÇALIŞIR: " + e.why);
  if(e.example) out.push("\nPAYLOAD: " + e.example);
  if(e.how_to_use) out.push("\nNASIL KULLANILIR: " + e.how_to_use);
  if(e.mitigation) out.push("\nÖNLEM: " + e.mitigation);
  if(e.real_case) out.push("\nGERÇEK OLAY: " + e.real_case);
  if(e.source) out.push("\nKAYNAK: " + e.source);
  const pr = practiceFor(e.category).slice(0,2);
  if(pr.length) out.push("\n🎯 PRATİK: " + pr.map(t => t.name + " — " + t.url).join("   ·   "));
  return out.join("\n");
}

/* ================= senkron (kişisel GitHub gist) =================
   İçerik (sorular, senaryolar) bu sayfanın içinde gelir; sayfa her sabah yeniden
   yayımlanır. İlerleme + notlar + raporlar ise kullanıcının KENDİ gizli gist'inde
   durur; laptop uygulaması da aynı gist'i kullanır. Anahtar yoksa her şey bu
   cihazda kalır (arkadaş modu). */
const LST = "aisec-gh-token", LSG = "aisec-gh-gist";
const GIST_DESC = "ai-security-lab-sync";
let syncTimer = null;
function lsGet(k){ try{ return localStorage.getItem(k) || ""; }catch(e){ return ""; } }
function lsSet(k, v){ try{ v ? localStorage.setItem(k, v) : localStorage.removeItem(k); }catch(e){} }
function setDot(cls, title){
  const d = document.getElementById("syncDot");
  d.className = "syncdot " + (cls||"");
  d.title = title || "";
  state.syncMsg = title || "";
}
async function gh(path, opts){
  opts = opts || {};
  const r = await fetch("https://api.github.com" + path, {
    method: opts.method || "GET",
    headers: Object.assign({"Accept":"application/vnd.github+json",
                            "Authorization":"Bearer " + state.token},
                           opts.body ? {"Content-Type":"application/json"} : {}),
    body: opts.body ? JSON.stringify(opts.body) : undefined,
    cache: "no-store",
  });
  if(!r.ok) throw new Error("GitHub " + r.status);
  return r.json();
}
async function findGist(){
  let gid = lsGet(LSG);
  if(gid) return gid;
  for(let page = 1; page <= 3; page++){
    const rows = await gh("/gists?per_page=100&page=" + page);
    const g = rows.find(x => x.description === GIST_DESC);
    if(g){ lsSet(LSG, g.id); return g.id; }
    if(rows.length < 100) break;
  }
  const g = await gh("/gists", {method:"POST", body:{description:GIST_DESC, public:false,
    files:{"sync.json":{content:JSON.stringify({progress:{}, notes:[], updated:new Date().toISOString(), device:"cep"})},
           "reports.json":{content:"[]"}}}});
  lsSet(LSG, g.id);
  return g.id;
}
async function readGist(){
  const g = await gh("/gists/" + state.gist);
  const file = async name => {
    const f = (g.files || {})[name];
    if(!f) return null;
    let raw = f.content;
    if(f.truncated && f.raw_url) raw = await (await fetch(f.raw_url, {cache:"no-store"})).text();
    try{ return JSON.parse(raw || "null"); }catch(e){ return null; }
  };
  return {sync: (await file("sync.json")) || {}, reports: (await file("reports.json")) || []};
}
function mergeNotes(a, b){
  const by = {}, order = [];
  (a || []).concat(b || []).forEach(n => {
    if(!n || !n.id) return;
    const cur = by[n.id];
    if(!cur){ by[n.id] = Object.assign({}, n); order.push(n.id); }
    else if((n.answer || "").trim() && !(cur.answer || "").trim()){
      cur.answer = n.answer; cur.answered_day = n.answered_day || "";
    }
  });
  return order.map(i => by[i]).sort((x,y) =>
    ((x.day||"") + (x.time||"")).localeCompare((y.day||"") + (y.time||"")));
}
function scheduleSync(){
  state.dirty = true;
  if(syncTimer) clearTimeout(syncTimer);
  syncTimer = setTimeout(pushProgress, 2500);
}
async function pushProgress(){
  if(!state.gist || state.saving || !state.dirty) return;
  state.saving = true; state.dirty = false;
  try{
    // oku → birleştir → yaz: laptopun bu arada yazdıkları kaybolmasın
    const cur = (await readGist()).sync;
    const remoteP = cur.progress || {};
    state.progress = mergeProgress(state.progress, remoteP);
    state.notes = mergeNotes(state.notes, cur.notes);
    saveLocal(); saveNotesLocal();
    // laptopa özgü alanlar (tools_tried vb.) telefonda yok; üzerine yazmadan koru
    const progress = Object.assign({}, remoteP, state.progress);
    await gh("/gists/" + state.gist, {method:"PATCH", body:{files:{"sync.json":{content:
      JSON.stringify({progress, notes: state.notes, updated: new Date().toISOString(), device:"cep"})}}}});
    setDot("on", "senkron: " + new Date().toLocaleTimeString("tr-TR"));
  }catch(e){
    state.dirty = true;
    setDot("off", "senkron bekliyor (" + e.message + ")");
  }finally{
    state.saving = false;
    if(state.dirty) setTimeout(scheduleSync, 15000);
  }
}
async function initDb(){
  state.token = lsGet(LST).trim();
  if(!state.token){ setDot("off", "senkron kapalı — ilerlemen bu cihazda"); return; }
  try{
    state.gist = await findGist();
    const {sync, reports} = await readGist();
    if(sync.progress) state.progress = mergeProgress(state.progress, sync.progress);
    state.notes = mergeNotes(state.notes, sync.notes);
    state.reports = (Array.isArray(reports) ? reports : [])
      .slice().sort((a,b) => (b.day||"").localeCompare(a.day||""));
    saveLocal(); saveNotesLocal();
    setDot("on", "senkron açık");
  }catch(e){
    state.gist = null;
    setDot("off", "senkron olmadı (" + e.message + ") — anahtarı kontrol et");
  }
  specs = buildSpecs();
  paintTop(); render();
  try{ KV.paint(); }catch(e){}
  if(state.dirty) pushProgress();
}

function startExam(){
  const sel = document.getElementById("exArea").value;
  const n = parseInt(document.getElementById("exCount").value, 10) || 20;
  let area = null;
  if(sel === "") area = nextArea();
  else if(sel !== "ALL") area = sel;
  const batch = pickBatch(specs, n, area);
  if(!batch.length){ alert("Bu alanda gösterilecek soru bulunamadı."); return; }
  state.exam = {batch, i:0, correct:0, sure:0, elim:0, missed:[], q:null, done:false};
  advance(0);
}
function advance(step){
  const ex = state.exam;
  ex.i += step;
  while(ex.i < ex.batch.length){
    const q = makeQuestion(ex.batch[ex.i]);
    if(q){ ex.q = q; render(); return; }
    ex.i++;
  }
  ex.done = true; render();
}
function answer(idx){
  const ex = state.exam, q = ex.q, correct = idx === q.answer;
  document.querySelectorAll("#opts .opt").forEach((b,i) => {
    b.disabled = true;
    if(i === q.answer) b.classList.add("correct");
    else if(i === idx) b.classList.add("wrong");
    else b.classList.add("muted");
  });
  const body = q.entry ? lessonText(q.entry)
    : (q.hand && q.hand.explain ? q.hand.explain + (q.hand.source ? "\n\nKAYNAK: " + q.hand.source : "")
    : (q.tool ? "ARAÇ: " + q.tool.name + " (" + (q.tool.vendor||"") + ")\n\n" + (q.tool.what||"") +
        "\n\nNASIL: " + (q.tool.how_to_use||"") + "\n\nKURULUM: " + (q.tool.install||"") +
        "\n\nKAYNAK: " + (q.tool.source||"")
      : "Doğru cevap: " + q.options[q.answer]));
  const after = document.getElementById("after");
  after.innerHTML = "<div class='verdict " + (correct ? "ok" : "no") + "'>" +
    "<h3>" + (correct ? "✅ Doğru — peki emin miydin?" : "❌ Yanlış — bu soru tekrar gelecek") + "</h3>" +
    (correct
      ? "<p class='sureq'>Eleyerek bulduysan bilinmiş saymıyoruz; soru yarın yine gelir.</p>" +
        "<div class='row'><button class='btn primary' id='bSure' style='flex:1'>Emindim</button>" +
        "<button class='btn' id='bElim' style='flex:1'>🤔 Eleyerek buldum</button></div>"
      : "<button class='btn full' id='bNext'>Sonraki →</button>") +
    "<div class='lesson'>" + linkify(body) + "</div></div>";
  after.scrollIntoView({behavior:"smooth", block:"nearest"});
  const commit = sure => {
    record(q, correct, sure);
    if(correct){ ex.correct++; sure ? ex.sure++ : ex.elim++; if(!sure) ex.missed.push({q, kind:"eleyerek"}); }
    else ex.missed.push({q, kind:"yanlış"});
    advance(1);
  };
  if(correct){
    document.getElementById("bSure").onclick = () => commit(true);
    document.getElementById("bElim").onclick = () => commit(false);
  }else{
    document.getElementById("bNext").onclick = () => commit(true);
  }
}
function renderExamDone(){
  const ex = state.exam, total = ex.i;
  const pct = total ? Math.round(ex.sure/total*100) : 0;
  let cpMsg = "";
  if(ex.check){
    const need = ex.check.pass || 70, passed = pct >= need;
    if(passed){ pathProg().done[ex.check.module] = {day:today(), score:pct};
      saveLocal(); scheduleSync(); }
    cpMsg = "<div class='card' style='border-color:" + (passed ? "var(--accent)" : "var(--warn)") +
      "'><b style='color:" + (passed ? "var(--accent)" : "var(--warn)") + ";font-size:14px'>" +
      (passed ? "🎓 Kontrol noktası geçildi — " + esc(ex.check.title)
              : "🎯 Kontrol noktası: %" + pct + " — geçmek için %" + need + " lazım") + "</b>" +
      (passed ? "" : "<div class='soft' style='font-size:13px;margin-top:6px'>Modülü tekrar oku, sonra yeniden dene.</div>") +
      "</div>";
    ex.check = null;

    "<div class='card'><div style='font-size:15px'>" + total + " soruda <b>" + ex.correct +
    "</b> doğru — <b style='color:var(--accent)'>" + ex.sure + "</b> tanesini gerçekten bildin, <b style='color:var(--warn)'>" +
    ex.elim + "</b> tanesini eleyerek buldun.</div>" +
    "<div class='count' style='margin-top:8px'>GERÇEK BİLGİ ORANIN: " + pct + "%</div>" +
    "<div class='bar'><i style='width:" + pct + "%'></i></div></div>" +
    (ex.missed.length ? "<div class='card'><b style='font-size:14px'>Çalışman gerekenler</b>" +
      "<div class='rule'></div>" + ex.missed.map(m => {
        const name = (m.q.entry && m.q.entry.technique) || (m.q.tool && m.q.tool.name) || trim(m.q.prompt, 60);
        return "<div style='margin-bottom:12px'><div class='k mono' style='color:" +
          (m.kind === "yanlış" ? "var(--bad)" : "var(--warn)") + "'>" + m.q.area + " · " + m.kind + "</div>" +
          "<div style='font-weight:600;font-size:14px;margin:2px 0 4px'>" + esc(name) + "</div>" +
          "<div class='lesson' style='max-height:none'>" +
            linkify(m.q.entry ? lessonText(m.q.entry) : ((m.q.hand && m.q.hand.explain) || "")) + "</div></div>";
      }).join("") + "</div>" : "") +
    "<div class='row' style='margin-top:12px'><button class='btn primary full' id='again'>Yeni sınav</button></div>";
  document.getElementById("again").onclick = () => { state.exam = null; render(); };
  if(!ex._kv){ ex._kv = true; try{ KV.onExamDone(total, ex.sure); }catch(e){} }
  paintTop();
}

/* ---- seçince nota ekle (masaüstündeki terminal usulü kopyalamanın telefon karşılığı) ---- */
let selTimer = null, selText = "";
function appendToNote(t){
  const ta = document.getElementById("noteText");
  if(!ta || !t) return;
  const cur = ta.value.trim();
  ta.value = (cur ? ta.value.replace(/\s+$/, "") + "\n" : "") + "“" + t + "” → ";
  try{ navigator.clipboard && navigator.clipboard.writeText(t); }catch(e){}
  const msg = document.getElementById("noteMsg");
  if(msg){ msg.textContent = "✓ seçim nota eklendi — yanına ne anlamadığını yaz";
           msg.style.color = "var(--accent)"; }
  ta.focus();
  try{ ta.setSelectionRange(ta.value.length, ta.value.length); }catch(e){}
}
document.addEventListener("selectionchange", () => {
  clearTimeout(selTimer);
  selTimer = setTimeout(() => {
    const chip = document.getElementById("selChip");
    const sel = window.getSelection();
    const t = (sel ? sel.toString() : "").replace(/\s+/g, " ").trim();
    const node = sel && sel.anchorNode;
    const inView = node && document.getElementById("view").contains(node);
    const inNote = node && document.getElementById("noteText") &&
                   document.getElementById("noteText").contains(node);
    if(state.tab !== "exam" || !inView || inNote || t.length < 2 ||
       !document.getElementById("noteText")){ chip.hidden = true; return; }
    selText = t.length > 400 ? t.slice(0, 399) + "…" : t;
    chip.textContent = "➕ Nota ekle: “" + trim(selText, 38) + "”";
    chip.hidden = false;
  }, 250);
});
document.getElementById("selChip").addEventListener("pointerdown", e => {
  e.preventDefault();               // seçim kaybolmadan önce yakala
  const chip = e.currentTarget;
  appendToNote(selText);
  chip.hidden = true;
  try{ window.getSelection().removeAllRanges(); }catch(err){}
});

/* ---------- eğitim yolu ---------- */
function pathProg(){
  const p = state.progress;
  if(!p.path || typeof p.path !== "object") p.path = {read:{}, done:{}};
  p.path.read = p.path.read || {}; p.path.done = p.path.done || {};
  return p.path;
}
const secRead = id => !!pathProg().read[id];
const modDone = id => !!pathProg().done[id];
function modStatus(m){
  const secs = m.sections || [];
  return {read: secs.filter(s => secRead(s.id)).length, total: secs.length, done: modDone(m.id)};
}

        "<div class='k mono' style='color:" + col + "'>MODÜL " + String(m.order||"").padStart(2,"0") +

        "<h4 style='margin-top:4px'>" + esc(m.title) + "</h4>" +
        "<div class='soft' style='font-size:12.5px;margin-top:5px'>" + esc(trim(m.goal, 150)) + "</div></button>";
    }).join("");
  document.querySelectorAll(".item[data-mod]").forEach(b => b.onclick = () => {

    const set = (id, c) => document.getElementById(id).setAttribute("stop-color", c);
    set("kvO1", p[0]); set("kvO2", p[1]); set("kvM1", p[2]); set("kvM2", p[3]);
    document.getElementById("kvCore").setAttribute("fill", p[4]);
    const sc = document.getElementById("kvScale");
    sc.style.transform = "scale(" + SCALE[L] * (mood === "sulk" ? .9 : 1) + ")";
    sc.style.filter = mood === "out" ? "url(#kvG)" : (mood === "sulk" ? "saturate(.55)" : "none");
    document.getElementById("kvBody").setAttribute("class", "kv-body " + mood);
    document.getElementById("kvCrown").style.display = (L === 4 && mood !== "out") ? "" : "none";
    const sg = document.getElementById("kvSparks"); sg.innerHTML = "";
    const n = (mood === "out" || mood === "sulk") ? 0 : [0,2,5,8,12][L];
    for(let i = 0; i < n; i++){
      const c = el("circle", {cx:70 + Math.random()*60, cy:120 + Math.random()*50, r:1.6 + Math.random()*2.2,
        fill:i % 3 === 0 ? "#ffc15e" : p[1], "class":"kv-spark"}, sg);
      c.style.setProperty("--dx", (Math.random()*50 - 25) + "px");
      c.style.animationDelay = (Math.random()*1.8) + "s"; c.style.animationDuration = (1.3 + Math.random()*1.2) + "s";
    }
    const sm = document.getElementById("kvSmoke"); sm.innerHTML = "";
    if(mood === "out") for(let i = 0; i < 3; i++){ const c = el("circle", {cx:96 + i*4, cy:110, r:9, fill:"#6a6474", "class":"kv-smoke"}, sm); c.style.animationDelay = i + "s"; }
    paintEyes(mood);
    const top = document.getElementById("kvTop");
    top.innerHTML = '<svg viewBox="40 10 130 200"><path d="' + OUT + '" fill="' + (mood === "out" ? "#6a6474" : p[1]) + '"/><path d="' + CORE + '" fill="' + p[4] + '" opacity=".85"/></svg>' + s;
    top.title = s + " günlük seri";
  }

  /* ---- gerçek veriden mesaj ---- */
  function facts(){
    const p = state.progress, rows = planRows();
    const done = rows.reduce((a, r) => a + r.done, 0);
    const nxt = nextArea();
    const weak = weakAreas(2);
    const newQ = state.questions.filter(q => q.added === today() && !Object.keys(p.items).some(k => k.indexOf(q.id + "|") === 0)).length;
    let lastBad = null;
    Object.entries(p.items).forEach(([k, v]) => {
      if(v.last_result === "bad" && (!lastBad || (v.last || "") > (lastBad[1].last || ""))) lastBad = [k, v];
    });
    let badName = null;
    if(lastBad){
      const id = lastBad[0].split("|")[0], a = findAttack(id);
      badName = a ? a.technique : null;
    }
    const answered = state.notes.filter(n => (n.answer || "").trim() && n.answered_day === today()).length;
    const openNotes = state.notes.filter(n => !(n.answer || "").trim()).length;
    return {done, goal: GOAL * AREAS.length, nxt, left: nxt ? GOAL - ((p.daily.per || {})[nxt] || 0) : 0,
            weak, newQ, badName, answered, openNotes, streak: effStreak(), best: p.best_streak || 0, away: daysAway()};
  }
  function messages(){
    const f = facts(), out = [];
    const B = s => "<b>" + esc(s) + "</b>";
    if(mood === "new"){
      out.push("Selam! Ben " + B("Kıvılcım") + ". Her gün soru çözdükçe büyürüm, gelmezsen sönerim. İlk soruyla yak beni 🔥");
      out.push("Günde " + B(f.goal + " soru") + " hedefimiz var ama 20 soruyla başlasak bile yanarım.");
    } else if(mood === "happy"){
      if(f.done >= f.goal) out.push(B(f.goal + "/" + f.goal) + "! Bugün her alanı bitirdin. Efsanesin 👑");
      else out.push("Bugün " + B(f.done + " soru") + " çözdün. " + (f.nxt ? "Sırada " + B(f.nxt) + ", " + f.left + " soru kaldı." : ""));
      out.push("Seri " + B(f.streak + " gün") + "! " + (f.streak >= f.best && f.streak > 1 ? "Rekorundasın, bak alevime!" : "Rekorun " + f.best + ", yaklaşıyoruz."));
      if(f.badName) out.push("En son " + B(f.badName) + "'da takıldın. Birkaç gün sonra başka açıdan tekrar soracağım 😏");
    } else if(mood === "wait"){
      out.push("Bugün daha gelmedin… " + (f.streak ? B(f.streak + " günlük") + " serin gece yarısı söner!" : "") + " 20 soru, 10 dakika.");
      if(f.newQ) out.push("Sabah " + B(f.newQ + " yeni soru") + " geldi, ilk sen çöz.");
      if(f.answered) out.push("Notlarından " + B(f.answered) + " tanesine cevap geldi. Rapor sekmesinde seni bekliyor.");
      if(f.weak.length) out.push("En zayıf alanın " + B(f.weak[0]) + ". Bugün oraya yüklenelim mi?");
    } else if(mood === "sulk"){
      out.push("Dün gelmedin. " + B("Hmph."));
      out.push("…");
      out.push("Serimiz söndü sayılır. " + (f.weak.length ? B(f.weak[0]) + " soruların hazır, bir tur çözersen affederim belki." : "Bir tur çözersen affederim belki."));
    } else {
      out.push("Ben burada tek başıma yandım durdum 🥲");
      out.push(B(f.away + " gündür") + " yoksun. Tek bir soru yeter, yeniden yanarım.");
      if(f.newQ || f.openNotes) out.push("Bu arada " + (f.newQ ? B(f.newQ + " yeni soru") : "") + (f.newQ && f.openNotes ? " ve " : "") + (f.openNotes ? B(f.openNotes + " açık not") : "") + " birikti.");
    }
    return out.filter(Boolean);
  }
  const TITLE = {new:"KIVILCIM", happy:"KIVILCIM · MUTLU", wait:"KIVILCIM · BEKLİYOR", sulk:"KIVILCIM · KÜS", out:"KIVILCIM · SÖNÜYOR"};

  function say(html, opts){
    opts = opts || {};
    const b = document.getElementById("kvBubble");
    b.innerHTML = "<small>" + (opts.title || TITLE[mood]) + "</small>" + html +
      (opts.action !== false ? "<div class='kv-act'><button class='go' id='kvGo'>" + (opts.goText || "Sınava başla") + "</button><button id='kvLater'>Sonra</button></div>" : "");
    b.hidden = false; b.style.animation = "none"; void b.offsetWidth; b.style.animation = "";
    const go = document.getElementById("kvGo"), later = document.getElementById("kvLater");
    if(go) go.onclick = () => { hide(); (opts.onGo || goExam)(); };
    if(later) later.onclick = hide;
    clearTimeout(bubbleTimer);
    bubbleTimer = setTimeout(hide, opts.ms || 9000);
  }
  function hide(){ document.getElementById("kvBubble").hidden = true; }
  function goExam(){ document.querySelector('.tab[data-tab="exam"]').click(); }
  function anim(cls){
    const b = document.getElementById("kvBody");
    b.setAttribute("class", "kv-body " + cls);
    setTimeout(() => b.setAttribute("class", "kv-body " + mood), 650);
  }
  function puff(n, colors){
    const r = document.getElementById("kvDock").getBoundingClientRect();
    for(let i = 0; i < n; i++){
      const d = document.createElement("i"); d.className = "kv-puff";
      d.style.left = (r.left + r.width/2) + "px"; d.style.top = (r.top + r.height*0.35) + "px";
      d.style.background = colors[i % colors.length];
      d.style.setProperty("--x", (Math.random()*90 - 60) + "px"); d.style.setProperty("--y", (-40 - Math.random()*70) + "px");
      document.body.appendChild(d); setTimeout(() => d.remove(), 1000);
    }
  }
  function confetti(){
    const box = document.createElement("div"); box.className = "kv-confetti";
    const C = ["#ff4a3d","#c07cff","#4a86ff","#ffc15e","#7fd6a4","#ff6fb5"];
    const W = innerWidth;
    for(let i = 0; i < 70; i++){
      const c = document.createElement("i");
      c.style.left = (W/2 + (Math.random()*80 - 40)) + "px"; c.style.top = (innerHeight*0.55) + "px";
      c.style.background = C[i % C.length];
      c.style.setProperty("--x", (Math.random()*W - W/2) + "px");
      c.style.setProperty("--y", (-innerHeight*0.25 - Math.random()*innerHeight*0.35 + Math.random()*innerHeight*0.6) + "px");
      c.style.setProperty("--r", (Math.random()*720 - 360) + "deg");
      c.style.setProperty("--t", (1.1 + Math.random()*0.9) + "s");
      box.appendChild(c);
    }
    document.body.appendChild(box); setTimeout(() => box.remove(), 2300);
  }

  /* ---- olaylar ---- */
  function init(){
    document.getElementById("kvDock").innerHTML = svg();
    mood = calcMood(); paint();
    document.getElementById("kvDock").onclick = () => {
      const b = document.getElementById("kvBubble");
      if(!b.hidden){ hide(); return; }
      const m = messages(); say(m[msgIdx++ % m.length]); anim(mood === "sulk" ? "shake" : "jump");
    };
    let greeted = false;
    try{ greeted = sessionStorage.getItem("kv-greet") === today(); }catch(e){}
    if(!greeted){
      setTimeout(() => { say(messages()[0]); try{ sessionStorage.setItem("kv-greet", today()); }catch(e){} }, 1400);
    }
    ["click","touchstart","keydown"].forEach(ev => document.addEventListener(ev, () => lastAct = Date.now(), {passive:true}));
    setInterval(() => {                                   // uygulama açık ama boşta: dürt
      const f = facts();
      if(document.hidden || nudges >= 2 || f.done >= f.goal || state.exam && !state.exam.done) return;
      if(Date.now() - lastAct < 4*60*1000) return;
      nudges++; lastAct = Date.now();
      say(f.done ? "Mola uzadı 👀 " + (f.nxt ? "<b>" + f.nxt + "</b>'de " + f.left + " soru kaldı." : "")
                 : "Buradayım, bekliyorum… Bir tur çözelim mi? 🔥");
      anim("jump");
    }, 30000);
  }
  function onRecord(correct, sure, before){
    const p = state.progress;
    const was = mood; mood = "happy";
    if(was !== "happy"){ paint(); anim("jump");
      if(was === "sulk" || was === "out") say("Geldin! 🥹 Küslük bitti, yeniden yanıyorum.", {action:false, ms:4500});
      else if(p.streak > 1) say("Seri <b>" + p.streak + " gün</b> oldu! 🔥", {action:false, ms:4000});
      else say("Ateş yandı! İlk soru tamam 🔥", {action:false, ms:4000});
      if(p.streak > (before.best || 0) && p.streak > 1) setTimeout(() => { confetti(); say("Yeni rekor: <b>" + p.streak + " gün</b>! 👑", {action:false, ms:5000}); }, 1200);
      return;
    }
    if(correct && sure){ anim("jump"); puff(8, ["#c07cff","#ffc15e","#ff4a3d"]); }
    else if(!correct) anim("shake");
    const area = before.area, per = (p.daily.per || {})[area] || 0;
    if(per === GOAL){ confetti(); say("<b>" + area + "</b> bugünlük bitti (" + GOAL + "/" + GOAL + ")! Sıradaki alana geçelim mi?", {action:false, ms:5500}); }
    const done = planRows().reduce((a, r) => a + r.done, 0);
    if(done === GOAL * AREAS.length){ setTimeout(() => { confetti(); confetti(); say("<b>220/220</b>. Bugün bütün alanları bitirdin. Taç senin 👑", {action:false, ms:7000}); }, 900); }
    paint();
  }
  function onExamDone(total, sure){
    if(!total) return;
    const pct = Math.round(sure/total*100);
    if(pct >= 80){ confetti(); say("Gerçek bilgi oranın <b>%" + pct + "</b>. Alevim bundan büyüyor 🔥", {goText:"Yeni sınav"}); }
    else if(pct >= 50) say("%" + pct + " gerçek bilgi. Fena değil; yanlışların birkaç gün sonra başka açıdan gelecek.", {goText:"Yeni sınav"});
    else say("%" + pct + "… Üzülme, ben de ilk başta kordum. Çalışman gerekenler aşağıda 👇", {action:false});
  }
  return {init, onRecord, onExamDone, paint: () => { mood = calcMood(); paint(); }};
})();

/* ================= başlat ================= */
const local = loadLocal();
if(local) state.progress = mergeProgress(state.progress, local);
state.notes = loadNotesLocal();
specs = buildSpecs();
paintTop();
render();
try{ KV.init(); }catch(e){}
setDot("", "senkron bekleniyor");
initDb();
document.addEventListener("visibilitychange", () => { if(document.hidden && state.dirty) pushProgress(); });
document.getElementById("syncDot").parentElement.onclick = () => document.querySelector('.tab[data-tab="rep"]').click();
})();
</script>
