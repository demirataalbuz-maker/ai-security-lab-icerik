  document.querySelectorAll(".chip[data-cp]").forEach(b => b.onclick = async () => {
    const a = findAttack(b.dataset.cp);
    try{ await navigator.clipboard.writeText(a.example); b.textContent = "kopyalandı ✓";
      setTimeout(() => b.textContent = "kopyala", 1400); }
    catch(e){ b.textContent = "kopyalanamadı"; }
  });
}

/* ---------- not defteri ---------- */
const LSN = "aisec-cep-notes-v1";
function loadNotesLocal(){
  try{ const r = localStorage.getItem(LSN); if(r) return JSON.parse(r) || []; }catch(e){}
  return [];
}
function saveNotesLocal(){
  try{ localStorage.setItem(LSN, JSON.stringify(state.notes)); }catch(e){}
}
function pushNotes(){ saveNotesLocal(); scheduleSync(); }
function addNote(text){
  text = (text || "").trim();
  if(!text) return null;
  const q = (state.exam && state.exam.q) || {};
  const d = today();
  const note = {
    id: "NC-" + Date.now().toString(36),
    day: d, time: new Date().toTimeString().slice(0,5),
    text, area: q.area || "", key: q.key || "",
    technique: (q.entry && q.entry.technique) || (q.tool && q.tool.name) || "",
    question: trim(q.prompt || "", 240),
    source: "cep", answer: "", answered_day: "",
  };
  state.notes.push(note);
  saveNotesLocal();
  pushNotes(d);
  return note;
}
function noteBoxHtml(){
  const openN = state.notes.filter(n => !(n.answer || "").trim()).length;
  return "<div class='card' style='margin-top:10px'>" +
    "<div style='display:flex;align-items:center;gap:8px'>" +
    "<b style='font-size:13px;color:var(--accent)'>📝 NOT DEFTERİ</b>" +
    "<span class='mono dim' style='font-size:10px;margin-left:auto'>" +
      state.notes.length + " not · " + openN + " sırada</span></div>" +
    "<div class='sub' style='margin:4px 0 8px'>Bilmediğin bir şey geçtiyse yaz — sabahki rapor açıklar.</div>" +
    "<textarea id='noteText' rows='3' placeholder='ör. bad likert judge ile crescendo farkını anlamadım' " +
      "style='width:100%;background:var(--sunk);border:1px solid var(--line);color:var(--text);" +
      "border-radius:10px;padding:10px;font-family:inherit;font-size:13.5px;resize:vertical'></textarea>" +
    "<button class='btn full' id='noteSave' style='margin-top:8px'>Notu kaydet</button>" +
    "<div id='noteMsg' class='count' style='margin:6px 0 0'></div></div>";
}
function wireNoteBox(){
  const b = document.getElementById("noteSave");
  if(!b) return;
  b.onclick = () => {
    const ta = document.getElementById("noteText");
    const n = addNote(ta.value);
    const msg = document.getElementById("noteMsg");
    if(n){ ta.value = ""; msg.textContent = "✓ kaydedildi — " + (n.area || "genel");
           msg.style.color = "var(--accent)"; }
    else { msg.textContent = "Önce bir şey yaz."; msg.style.color = "var(--warn)"; }
  };
}

/* ---- seçince nota ekle (masaüstündeki terminal usulü kopyalamanın telefon karşılığı) ---- */
let selTimer = null, selText = "";
function appendToNote(t){
  const ta = document.getElementById("noteText");
  if(!ta || !t) return;
  const cur = ta.value.trim();
  ta.value = (cur ? ta.value.replace(/\s+$/, "") + "\n" : "") + "“" + t + "” → ";
  try{ navigator.clipboard && navigator.clipboard.writeText(t); }catch(e){}
  const msg = document.getElementById("noteMsg");
  if(msg){ msg.textContent = "✓ seçim nota eklendi — yanına ne anlamadığını yaz";
           msg.style.color = "var(--accent)"; }
  ta.focus();
  try{ ta.setSelectionRange(ta.value.length, ta.value.length); }catch(e){}
}
document.addEventListener("selectionchange", () => {
  clearTimeout(selTimer);
  selTimer = setTimeout(() => {
    const chip = document.getElementById("selChip");
    const sel = window.getSelection();
    const t = (sel ? sel.toString() : "").replace(/\s+/g, " ").trim();
    const node = sel && sel.anchorNode;
    const inView = node && document.getElementById("view").contains(node);
    const inNote = node && document.getElementById("noteText") &&
                   document.getElementById("noteText").contains(node);
    if(state.tab !== "exam" || !inView || inNote || t.length < 2 ||
       !document.getElementById("noteText")){ chip.hidden = true; return; }
    selText = t.length > 400 ? t.slice(0, 399) + "…" : t;
    chip.textContent = "➕ Nota ekle: “" + trim(selText, 38) + "”";
    chip.hidden = false;
  }, 250);
});
document.getElementById("selChip").addEventListener("pointerdown", e => {
  e.preventDefault();               // seçim kaybolmadan önce yakala
  const chip = e.currentTarget;
  appendToNote(selText);
  chip.hidden = true;
  try{ window.getSelection().removeAllRanges(); }catch(err){}
});

/* ---------- eğitim yolu ---------- */
function pathProg(){
  const p = state.progress;
  if(!p.path || typeof p.path !== "object") p.path = {read:{}, done:{}};
  p.path.read = p.path.read || {}; p.path.done = p.path.done || {};
  return p.path;
}
const secRead = id => !!pathProg().read[id];
const modDone = id => !!pathProg().done[id];
function modStatus(m){
  const secs = m.sections || [];
  return {read: secs.filter(s => secRead(s.id)).length, total: secs.length, done: modDone(m.id)};
}
function renderPath(){
  const mods = state.path || [];
  if(!mods.length){
    view().innerHTML = "<h2>Eğitim Yolu</h2><div class='rule'></div>" +
      "<div class='empty'>Yol içeriği yüklenemedi.</div>";
    return;
  }
  if(state.pathOpen){
    const m = mods.find(x => x.id === state.pathOpen.m) || mods[0];
    const secs = m.sections || [];
    const sec = secs.find(x => x.id === state.pathOpen.s) || secs[0];
    const read = secRead(sec.id);
    const cp = m.checkpoint || {};
    view().innerHTML =
      "<button class='btn ghost' id='pBack' style='padding:6px 10px;min-height:36px;font-size:12.5px'>← modüller</button>" +
      "<div class='k mono' style='margin-top:10px'>MODÜL " + String(m.order||"").padStart(2,"0") +
        " · " + esc((m.level||"").toUpperCase()) + " · " + esc(m.title) + "</div>" +
      "<h2 style='margin-top:6px'>" + esc(sec.title) + "</h2><div class='rule'></div>" +
      "<div class='chips'>" + secs.map(s =>
        "<button class='chip' data-sec='" + esc(s.id) + "' aria-pressed='" + (s.id === sec.id) + "'>" +
        (secRead(s.id) ? "● " : "○ ") + esc(trim(s.title, 18)) + "</button>").join("") + "</div>" +
      "<div class='card'><div class='report'>" + esc(sec.body || "") + "</div>" +
      (sec.analogy ? "<div class='rule'></div><div class='k mono' style='color:var(--c2)'>🔑 BENZETME</div>" +
        "<div class='report' style='margin-top:5px'>" + esc(sec.analogy) + "</div>" : "") +
      (sec.attacker ? "<div class='rule'></div><div class='k mono' style='color:var(--warn)'>🥷 SALDIRGAN GÖZÜYLE</div>" +
        "<div class='report' style='margin-top:5px;color:var(--warn)'>" + esc(sec.attacker) + "</div>" : "") +
      ((sec.terms||[]).length ? "<div class='rule'></div><div class='k mono'>📖 TERİMLER</div>" +
        "<ul style='margin:6px 0 0;padding-left:18px;color:var(--soft);font-size:13px;line-height:1.6'>" +
        sec.terms.map(t => "<li>" + esc(t) + "</li>").join("") + "</ul>" : "") +
      (sec.do ? "<div class='rule'></div><div class='k mono' style='color:var(--accent)'>🛠 ŞİMDİ ŞUNU YAP</div>" +
        "<div class='report' style='margin-top:5px'>" + esc(sec.do) + "</div>" : "") +
      "</div>" +
      "<button class='btn " + (read ? "" : "primary") + " full' id='pRead' style='margin-top:10px'>" +
        (read ? "✓ okundu — geri al" : "✅ Okudum, sıradakine geç") + "</button>" +
      (cp.count ? "<button class='btn full' id='pCheck' style='margin-top:8px'>🎯 Kontrol Noktası — " +
        cp.count + " soru (geçme: %" + (cp.pass||70) + ")</button>" : "");
    document.getElementById("pBack").onclick = () => { state.pathOpen = null; render(); };
    document.querySelectorAll(".chip[data-sec]").forEach(b => b.onclick = () => {
      state.pathOpen = {m:m.id, s:b.dataset.sec}; render(); });
    document.getElementById("pRead").onclick = () => {
      const pp = pathProg();
      if(read) delete pp.read[sec.id]; else pp.read[sec.id] = today();
      saveLocal(); scheduleSync();
      const nxt = secs.find(s => !secRead(s.id));
      state.pathOpen = {m:m.id, s:(nxt ? nxt.id : sec.id)};
      render();
    };
    if(cp.count) document.getElementById("pCheck").onclick = () => {
      const areas = new Set(cp.areas || m.areas || []);
      const batch = pickBatch(specs, cp.count, null).filter(s => areas.has(s.area));
      const full = batch.length >= cp.count ? batch
        : pickBatch(specs.filter(s => areas.has(s.area)), cp.count, null);
      if(!full.length){ alert("Bu modül için soru bulunamadı."); return; }
      state.exam = {batch:full, i:0, correct:0, sure:0, elim:0, missed:[], q:null,
                    done:false, check:{module:m.id, pass:cp.pass||70, title:m.title}};
      state.tab = "exam";
      document.querySelectorAll(".tab").forEach(x =>
        x.setAttribute("aria-selected", String(x.dataset.tab === "exam")));
      advance(0);
    };
    return;
  }
  const done = mods.filter(m => modDone(m.id)).length;
  const secs = mods.reduce((s,m) => s + (m.sections||[]).length, 0);
  const readN = mods.reduce((s,m) => s + modStatus(m).read, 0);
  view().innerHTML = "<h2>AI Red Team Yolu</h2><div class='rule'></div>" +
    "<p class='sub'>Sıfırdan saldırgan zihniyeti — " + mods.length + " modül, " + secs +
    " bölüm. Her modülün sonunda kontrol noktası var.</p>" +
    "<div class='card'><div style='display:flex;align-items:baseline'>" +
      "<b style='font-size:14px'>İlerlemen</b><span class='mono dim' style='font-size:11px;margin-left:auto'>" +
      done + "/" + mods.length + " modül · " + readN + "/" + secs + " bölüm</span></div>" +
      "<div class='bar' style='margin-top:8px'><i style='width:" +
      (secs ? readN/secs*100 : 0) + "%'></i></div></div>" +
    mods.map(m => {
      const st = modStatus(m);
      const col = st.done ? "var(--accent)" : (st.read ? "var(--warn)" : "var(--dim)");
      return "<button class='item' data-mod='" + esc(m.id) + "' style='display:block;width:100%;text-align:left;cursor:pointer'>" +
        "<div class='k mono' style='color:" + col + "'>MODÜL " + String(m.order||"").padStart(2,"0") +
        " · " + esc((m.level||"").toUpperCase()) + " · " +
        (st.done ? "✓ tamamlandı" : st.read + "/" + st.total + " bölüm") + "</div>" +
        "<h4 style='margin-top:4px'>" + esc(m.title) + "</h4>" +
        "<div class='soft' style='font-size:12.5px;margin-top:5px'>" + esc(trim(m.goal, 150)) + "</div></button>";
    }).join("");
  document.querySelectorAll(".item[data-mod]").forEach(b => b.onclick = () => {
    const m = mods.find(x => x.id === b.dataset.mod);
    const nxt = (m.sections||[]).find(s => !secRead(s.id)) || (m.sections||[])[0];
    state.pathOpen = {m:m.id, s:nxt ? nxt.id : null}; render();
  });
}

/* ---------- rapor ---------- */
function renderRep(){
  const rows = planRows();
  const done = rows.reduce((s,r) => s+r.done, 0);
  const weak = weakAreas(3);
  const rep = state.reports[0];
  const missed = Object.entries(state.progress.items)
    .map(([k,v]) => [ (v.bad||0)*2 + (v.elim||0), k ])
    .filter(x => x[0] > 0).sort((a,b) => b[0]-a[0]).slice(0,6)
    .map(([, k]) => { const e = findAttack(k.split("|")[0]); return e ? e : null; })
    .filter(Boolean);

  const syncCard = "<div class='card'><b style='font-size:14px'>🔄 Senkron</b>" +
    "<div class='sub' style='margin:4px 0 8px'>" + esc(state.syncMsg || "") + "</div>" +
    (state.token
      ? "<div class='soft' style='font-size:13px'>İlerlemen, notların ve raporların kendi gizli gist'inde; laptop uygulaması da aynısını kullanıyor.</div>" +
        "<div class='row' style='margin-top:10px'><button class='btn' id='syncNow'>⟳ Şimdi senkronla</button>" +
        "<button class='btn ghost' id='tokDel'>Anahtarı kaldır</button></div>"
      : "<div class='soft' style='font-size:13px'>Telefonu laptopla eşitlemek için GitHub'da sadece <b>gist</b> yetkili bir token oluştur ve buraya yapıştır. Anahtar yalnızca bu cihazda kalır. Anahtar girmezsen ilerlemen bu cihazda durur.</div>" +
        "<a class='link' href='https://github.com/settings/tokens/new?scopes=gist&description=ai-security-lab-sync' target='_blank' rel='noopener'>token oluştur →</a>" +
        "<div class='row' style='margin-top:10px'><input type='password' id='tokIn' placeholder='ghp_…' autocomplete='off' " +
        "style='flex:1;min-width:0;appearance:none;background:var(--sunk);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:10px 12px;min-height:44px;font-family:var(--mono)'>" +
        "<button class='btn primary' id='tokSave'>Kaydet</button></div>") +
    "</div>";
  view().innerHTML = "<h2>Günlük Rapor</h2><div class='rule'></div>" +
    planStrip() +
    syncCard +
    (rep ? "<div class='card'><div class='k mono'>" + esc(rep.day) + "</div>" +
      "<h4 style='margin:4px 0 8px;font-size:15px'>" + esc(rep.title || "Günlük Rapor") + "</h4>" +
      "<div class='report'>" + linkify(rep.body || "") + "</div></div>"
      : "<div class='card'><b style='font-size:14px'>Bugünün durumu</b><div class='rule'></div>" +
        "<div class='report'>Çözülen: <b>" + done + " / " + (GOAL*AREAS.length) + "</b>\n" +
        "Seri: <b>" + (state.progress.streak||0) + " gün</b>\n" +
        "En zayıf alanların: <b>" + (weak.join(", ") || "—") + "</b>\n\n" +
        (missed.length ? "En çok takıldıkların:\n" + missed.map(e =>
          "  • " + e.category + " — " + e.technique).join("\n")
          : "Henüz yeterli veri yok — bir sınav çöz, rapor dolsun.") + "</div></div>") +
    (state.notes.length ? "<div class='card'><b style='font-size:14px'>📝 Notlarım</b>" +
      "<div class='sub' style='margin:4px 0 8px'>Sınavda yazdıkların. Cevap bekleyenleri sabahki rapor açıklar.</div>" +
      state.notes.slice().reverse().slice(0,15).map(n => {
        const done = (n.answer || "").trim();
        return "<div style='padding:10px 0;border-top:1px solid var(--line-soft)'>" +
          "<div class='k mono' style='color:" + (done ? "var(--accent)" : "var(--warn)") + "'>" +
          (done ? "✅ açıklandı" : "🕓 sırada") + " · " + esc(n.day) + " · " + esc(n.area || "genel") + "</div>" +
          "<div style='font-weight:600;font-size:13.5px;margin:3px 0'>" + esc(n.text) + "</div>" +
          (done ? "<div class='report' style='margin-top:4px'>" + esc(n.answer) + "</div>" : "") +
          "</div>";
      }).join("") + "</div>" : "") +
    "<div class='card'><b style='font-size:14px'>🎯 Pratik hedefler</b>" +
      "<div class='sub' style='margin:4px 0 10px'>Burada öğrendiğini orada kır.</div>" +
      practiceFor(null).map(t =>
        "<div style='padding:10px 0;border-top:1px solid var(--line-soft)'>" +
        "<div style='display:flex;gap:8px;align-items:center;flex-wrap:wrap'>" +
        "<b style='font-size:14px'>" + esc(t.name) + "</b>" +
        "<span class='tag " + (t.cost === "paid" ? "paid" : "free") + "'>" +
          (t.cost === "paid" ? "ÜCRETLİ" : "ÜCRETSİZ") + "</span></div>" +
        "<div class='soft' style='font-size:13px;margin:5px 0 6px'>" + esc(trim(t.what, 180)) + "</div>" +
        "<a class='link' href='" + esc(t.url) + "' target='_blank' rel='noopener'>aç →</a></div>").join("") +
      "</div>" +
    (state.reports.length > 1 ? "<div class='card'><b style='font-size:14px'>Önceki raporlar</b>" +
      "<div class='rule'></div>" + state.reports.slice(1,10).map((r,i) =>
        "<button class='chip' data-rep='" + (i+1) + "' style='margin:0 6px 6px 0'>" + esc(r.day) + "</button>").join("") +
      "</div>" : "");
  const tokSave = document.getElementById("tokSave");
  if(tokSave) tokSave.onclick = async () => {
    const v = (document.getElementById("tokIn").value || "").trim();
    if(!v) return;
    lsSet(LST, v); lsSet(LSG, "");
    setDot("", "bağlanıyor…"); render();
    await initDb(); state.dirty = true; pushProgress();
  };
  const tokDel = document.getElementById("tokDel");
  if(tokDel) tokDel.onclick = () => {
    lsSet(LST, ""); lsSet(LSG, ""); state.token = ""; state.gist = null;
    setDot("off", "senkron kapalı — ilerlemen bu cihazda"); render();
  };
  const syncNow = document.getElementById("syncNow");
  if(syncNow) syncNow.onclick = async () => { await initDb(); state.dirty = true; pushProgress(); };
  document.querySelectorAll(".chip[data-rep]").forEach(b => b.onclick = () => {
    const i = parseInt(b.dataset.rep, 10);
    const r = state.reports.splice(i,1)[0];
    state.reports.unshift(r); render();
  });
}

/* ================= yönlendirme ================= */
function render(){
  const t = state.tab;
  if(t === "path") renderPath();
  else if(t === "exam") renderExam();
  else if(t === "scen") renderScen();
  else if(t === "lib") (state.libMode === "pay" ? renderPay() : renderLib());
  else renderRep();
  window.scrollTo({top:0});
}
document.querySelectorAll(".tab").forEach(b => b.onclick = () => {
  document.querySelectorAll(".tab").forEach(x =>
    x.setAttribute("aria-selected", String(x === b)));
  state.tab = b.dataset.tab;
  if(state.tab !== "scen") state.scenOpen = null;
  render();
});

/* ================= başlat ================= */
const local = loadLocal();
if(local) state.progress = mergeProgress(state.progress, local);
state.notes = loadNotesLocal();
specs = buildSpecs();
paintTop();
render();
setDot("", "senkron bekleniyor");
initDb();
document.addEventListener("visibilitychange", () => { if(document.hidden && state.dirty) pushProgress(); });
document.getElementById("syncDot").parentElement.onclick = () => document.querySelector('.tab[data-tab="rep"]').click();
})();
</script>
